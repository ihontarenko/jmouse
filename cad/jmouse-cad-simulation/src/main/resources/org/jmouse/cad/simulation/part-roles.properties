# What a component's kind (its `type`) makes a part of it, on a running sheet and on a pcb: a source that feeds the circuit,
# a store of energy that gives back what it took, or an instrument that reads or drives it. A kind named nowhere here
# dissipates. A component that writes a `measure { … }` reads the circuit, so it is an instrument whatever its kind.
# A source and an instrument are the bench's: the simulator drives and reads the circuit through them, and a pcb carries
# neither — where their signal enters, the circuit places a connector.
source = generator, power-supply, dual-power-supply, voltage-source, current-source
storing = capacitor, inductor
instrument = meter, controller
